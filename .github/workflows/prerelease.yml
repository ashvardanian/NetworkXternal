name: Pre-Release

on:
  push:
    branches: ["main-dev"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]
  pull_request:
    branches: ["main-dev"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]

env:
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

permissions:
  contents: read

# Superseded pull request runs cancel; pushes to `main-dev` finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            pyproject.toml:^version = "(\d+\.\d+\.\d+)"
            networkxternal/__init__.py:^__version__ = "(\d+\.\d+\.\d+)"
          dry-run: "true"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linters
        run: |
          python -m pip install --group lint
          npm install --global dprint
      - name: Check
        run: |
          ruff format --check networkxternal test bench
          ruff check networkxternal test bench
          dprint check

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
        python-version: ["3.12", "3.14t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sqlite]" --group test
      - name: Assert the GIL Stays Disabled
        if: ${{ endsWith(matrix.python-version, 't') }}
        run: python -c "import sys, networkxternal; assert not sys._is_gil_enabled(), 'importing networkxternal re-enabled the GIL'"
      - name: Test
        run: python -m pytest test -x -q

  # The same conformance suite, once per server, on the floor Python version only.
  test_servers:
    name: Python on ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: mongodb, extra: mongodb, profile: mongodb, url: "" }
          - { backend: postgres, extra: postgres, profile: postgres, url: "" }
          - { backend: clickhouse, extra: clickhouse, profile: clickhouse, url: "" }
          - { backend: neo4j, extra: neo4j, profile: neo4j, url: "" }
          - { backend: memgraph, extra: neo4j, profile: memgraph, url: "" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Start the Server
        run: docker compose -f bench/docker-compose.yml --profile ${{ matrix.profile }} up -d --wait
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${{ matrix.extra }}]" --group test
      - name: Test
        env:
          NETWORKXTERNAL_TEST_BACKEND: ${{ matrix.backend }}
        run: python -m pytest test -x -q
      - name: Stop the Server
        if: always()
        run: docker compose -f bench/docker-compose.yml --profile ${{ matrix.profile }} down
