name: Release

on:
  release:
    types: [published]

env:
  PYTHONUTF8: 1

permissions:
  contents: read
  id-token: write

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  publish:
    name: Publish to PyPI
    needs: hooks
    runs-on: ubuntu-26.04
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true
